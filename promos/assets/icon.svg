<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded tile: 22.44% radius, matching Appleseed's rx="35" on a 156px square -->
  <rect x="0" y="0" width="100" height="100" rx="22.44" fill="#CE8F5C"/>
  <!--
    A padlock in outline with a key and an export folder beside the keyhole: the lock is the data,
    the key is the access, the folder is the copy a data subject is entitled to walk away with.
    Redrawn from src/icon.jpg as filled geometry, every outline punched with an even-odd fill, so
    src/icon-mask.svg can be this glyph copied across unchanged.
  -->
  <g fill="#FEFEFE" fill-rule="evenodd">
    <!-- Shackle: two concentric arches, as in the artwork. Legs end inside the body's top bar. -->
    <path d="M31 46V36a19 19 0 0 1 38 0v10h-4.6V36a14.4 14.4 0 0 0-28.8 0v10z"/>
    <path d="M39.2 46V36a10.8 10.8 0 0 1 21.6 0v10h-4.4V36a6.4 6.4 0 0 0-12.8 0v10z"/>
    <!-- Body -->
    <path d="M30 44h40a6 6 0 0 1 6 6v30a6 6 0 0 1-6 6H30a6 6 0 0 1-6-6V50a6 6 0 0 1 6-6zM31 48.4a2.6 2.6 0 0 0-2.6 2.6v28a2.6 2.6 0 0 0 2.6 2.6h38a2.6 2.6 0 0 0 2.6-2.6V51a2.6 2.6 0 0 0-2.6-2.6z"/>
    <!-- Keyhole, in outline -->
    <path d="M45.6 66.6a7 7 0 1 1 8.8 0L56.9 77.6H43.1zM47.5 64.7a4.4 4.4 0 1 1 5 0L54 75.2H46z"/>
    <!-- Key: bow with a hole, shaft, two teeth -->
    <path d="M63.2 57.04a3.2 3.2 0 1 1 2 0V59h1.6v1.6h-1.6v1.2h1.2v1.6h-1.2V65l-1 1-1-1zM64.2 52.8a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4z"/>
    <!-- Folder with a download arrow -->
    <path d="M59.6 69.2H63l1.2 1.4H68a1.2 1.2 0 0 1 1.2 1.2v5.4a1.2 1.2 0 0 1-1.2 1.2h-8.4a1.2 1.2 0 0 1-1.2-1.2v-6.8a1.2 1.2 0 0 1 1.2-1.2zM59.6 72.6v4.6H68v-4.6zM63.3 73.2V75h-1.1l1.6 1.6 1.6-1.6h-1.1v-1.8z"/>
  </g>
</svg>
